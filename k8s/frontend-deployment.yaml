apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicore-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medicore-frontend
  template:
    metadata:
      labels:
        app: medicore-frontend
    spec:
      containers:
        - name: medicore-frontend
          image: asia-south1-docker.pkg.dev/gcp-devops-learning-514003/medicore-repo/medicore-frontend:13
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
